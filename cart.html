<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Review your shopping cart at Home Fashion."
    >

    <title>Shopping Cart | Home Fashion</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="header">

    <div class="container nav-container">

        <a
            href="index.html"
            class="logo"
        >
            HOME <span>FASHION</span>
        </a>


        <nav class="nav">

            <a href="index.html">
                Home
            </a>

            <a href="shop.html">
                Shop
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>


        <div class="nav-actions">

            <button
                type="button"
                class="search-btn"
                aria-label="Search"
            >
                ⌕
            </button>


            <a
                href="cart.html"
                class="cart active"
                aria-label="Shopping cart"
            >
                🛒

                <span id="cart-count">
                    0
                </span>

            </a>


            <button
                type="button"
                class="menu-btn"
                aria-label="Open menu"
            >
                ☰
            </button>

        </div>

    </div>


    <div class="search-box">

        <input
            type="search"
            placeholder="Search products..."
            aria-label="Search products"
        >

    </div>

</header>



<main>


    <section class="page-hero">

        <div class="container">

            <p class="eyebrow">
                YOUR SELECTION
            </p>

            <h1>
                Shopping Cart
            </h1>

            <p>
                Review your selected products.
            </p>

        </div>

    </section>



    <section class="section">

        <div class="container">

            <div class="cart-layout">


                <!-- PRODUCTS IN CART -->

                <div id="cart-items">
                </div>


                <!-- ORDER SUMMARY -->

                <aside
                    class="cart-summary"
                    id="cart-summary"
                >
                </aside>


            </div>

        </div>

    </section>

</main>



<footer class="footer">

    <div class="container">

        <div class="footer-bottom">

            <p>
                © 2026 Home Fashion.
                All rights reserved.
            </p>

        </div>

    </div>

</footer>



<script src="js/products.js"></script>

<script src="js/main.js"></script>


</body>

</html>
